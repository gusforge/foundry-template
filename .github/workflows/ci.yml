name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      # spotless:check + 单测 + ArchUnit + 端到端冒烟 + Testcontainers 集成测试
      # ubuntu runner 预装 Docker，DemoRepositoryIT 会真正运行
      - run: mvn -B verify
